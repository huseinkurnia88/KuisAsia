<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kuis Kampus Asia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F4B;--gold:#F5B82E;--red:#E63946;--teal:#2EC4B6;--blue:#2f7de1}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',system-ui,sans-serif;color:#fff;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 20% 5%,#1f4aa8 0,var(--navy) 55%,#07142f 100%) fixed}
.bub{position:fixed;left:0;bottom:0;border-radius:50%;opacity:.1;pointer-events:none;z-index:0;animation:float linear infinite}
@keyframes float{from{transform:translateY(20vh)}to{transform:translateY(-120vh)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px var(--gold),0 0 30px rgba(245,184,46,.4)}50%{box-shadow:0 0 0 6px var(--gold),0 0 70px rgba(245,184,46,.9)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.hide{display:none!important}.gold{color:var(--gold)}
.o0{background:var(--red)}.o1{background:var(--blue)}.o2{background:var(--gold);color:#3a2a00}.o3{background:var(--teal);color:#06302c}
.go{border:0;border-radius:99px;padding:16px 34px;font:800 20px Poppins,sans-serif;background:linear-gradient(135deg,var(--gold),#ffd76a);color:var(--navy);box-shadow:0 6px 0 #b9851a;cursor:pointer;animation:pulse 1.6s infinite}
.go:disabled{opacity:.4;animation:none}.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b9851a}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbzwY83WdNlwHDUYpG0Y5V86o6-GQRdXwKBTjyWJBdXZMBtZa0sRvh1zfVS-AEiWtV0SRg/exec';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.addEventListener('DOMContentLoaded',function(){var cl=['#F5B82E','#E63946','#2f7de1','#fff'];for(var i=0;i<14;i++){(function(i){var b=document.createElement('i'),s=30+Math.random()*120;b.className='bub';b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'vw;background:'+cl[i%4]+';animation-duration:'+(16+Math.random()*18)+'s;animation-delay:-'+Math.random()*25+'s';document.body.appendChild(b)})(i)}});
/* waktu server & panggilan */
var OFF=0;function now(){return Date.now()+OFF}
function call(fn,args,ok,bad){var t0=Date.now(),u=API_URL+'?fn='+fn+'&args='+encodeURIComponent(JSON.stringify(args||[]))+(typeof KEY!=='undefined'?'&key='+encodeURIComponent(KEY):'');fetch(u,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d&&d.now)OFF=d.now-(t0+Date.now())/2;ok&&ok(d)}).catch(function(e){bad&&bad(e)})}
/* bunyi */
var MUTE=false,AC;
function beep(f,d,t,v){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function tune(a){a.forEach(function(f,i){setTimeout(function(){beep(f,.25,'triangle',.08)},i*140)})}
/* angka naik */
function tween(el,to,ms,pre){var from=parseFloat(el.dataset.v||0),t0=performance.now();el.dataset.v=to;(function f(t){var k=Math.min(1,(t-t0)/(ms||700));el.textContent=(pre||'')+Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
/* konfeti & kembang api */
var FX=[],cv,cx,run=false,COL=['#F5B82E','#E63946','#2EC4B6','#4DA3FF','#fff','#ff8fa3'];
function fxInit(){if(cv)return;cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99';document.body.appendChild(cv);cx=cv.getContext('2d');var r=function(){cv.width=innerWidth;cv.height=innerHeight};r();addEventListener('resize',r)}
function confetti(n,x,y,sp){fxInit();for(var i=0;i<n;i++)FX.push({x:x,y:y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp*.9,g:.28,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[i%6],l:0,m:140+Math.random()*80});loop()}
function rain(){fxInit();for(var i=0;i<6;i++)FX.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,g:.03,w:6+Math.random()*8,h:4+Math.random()*6,r:0,vr:.2,c:COL[i%6],l:0,m:400});loop()}
function firework(x,y){fxInit();var c=COL[Math.floor(Math.random()*5)];for(var i=0;i<60;i++){var a=Math.random()*6.28,s=2+Math.random()*6;FX.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.05,w:3,dot:1,c:c,l:0,m:60+Math.random()*30})}loop()}
function loop(){if(run)return;run=true;(function f(){cx.clearRect(0,0,cv.width,cv.height);FX=FX.filter(function(p){p.l++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=Math.max(0,1-p.l/p.m);cx.fillStyle=p.c;if(p.dot){p.vx*=.97;cx.beginPath();cx.arc(p.x,p.y,p.w,0,6.3);cx.fill()}else{p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}return p.l<p.m&&p.y<cv.height+30});if(FX.length)requestAnimationFrame(f);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}})()}
</script>
<style>
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px 16px 28px}
#bar{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);border-radius:99px;padding:8px 18px;font-weight:700;font-size:14px;margin-bottom:12px}
#v{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:pop .4s}
h1{font-size:30px;font-weight:800;line-height:1.15}h2{font-size:26px;font-weight:800;margin:6px 0}
p,.msg{opacity:.85;font-size:15px;margin:8px 0}
.big{font-size:84px;line-height:1.1}.bn{animation:bounce 1s}.sh{animation:shake .6s}.spin{animation:spin 2s linear infinite;display:inline-block}
input{width:100%;border:0;border-radius:16px;padding:16px;font:700 20px Poppins,sans-serif;text-align:center;margin:14px 0;color:var(--navy)}
.qn{font-weight:700;opacity:.8;font-size:14px;text-align:left}
.qt{background:#fff;color:var(--navy);border-radius:18px;padding:16px;font-weight:800;font-size:20px;line-height:1.3;margin:8px 0 6px;text-align:left}
.tm{position:relative;height:22px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
.tm i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .12s linear}
.tm span{position:relative;font-size:12px;font-weight:700;line-height:22px}.tm.warn{animation:pulse .5s infinite}
.pb{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:15px;font:700 17px Poppins,sans-serif;color:inherit;margin:7px 0;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.15s;animation:pop .4s both}
.pb b{background:rgba(0,0,0,.2);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.pb:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}.pb.sel{outline:4px solid #fff;animation:bounce .5s}.pb.dim{opacity:.3}
.plus{font-size:34px;font-weight:800;color:#4cff9a}
.ans{background:rgba(255,255,255,.12);border-radius:16px;padding:12px;margin:12px 0;font-size:15px}
.stat{display:flex;justify-content:center;gap:22px;font-size:15px}.stat b{color:var(--gold);font-size:20px}
.dots span{display:inline-block;animation:bounce 1s infinite;font-size:30px}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}

.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(7,20,47,.93);overflow:hidden;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.ov .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(var(--c) 0 9deg,transparent 9deg 18deg);animation:spin 25s linear infinite}
.nc{position:relative;text-align:center;background:linear-gradient(160deg,var(--g1),var(--g2));color:var(--navy);border-radius:28px;padding:26px 20px;width:100%;max-width:370px;box-shadow:0 0 70px var(--c);animation:rise .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(90vh) scale(.6)}}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}
.medal{font-size:100px;line-height:1.1;animation:spinin 1s .5s both,bounce 1.6s 1.5s infinite}
.sl span{display:inline-block;font-weight:800;font-size:30px;animation:bounce 1.2s infinite}
.nc h2{font-size:28px;line-height:1.2;margin:8px 0}.nc p{opacity:.8}.nc .stat{margin:14px 0}.nc .stat b{color:var(--navy)}
.t1{--c:rgba(245,184,46,.45);--g1:#fff1c2;--g2:#F5B82E}.t2{--c:rgba(200,210,230,.35);--g1:#fff;--g2:#c3cde0}.t3{--c:rgba(217,154,99,.4);--g1:#ffe3c7;--g2:#d99a63}.t0{--c:rgba(77,163,255,.2);--g1:#fff;--g2:#cfe3ff}
</style></head><body>
<div id="app"><div id="bar" class="hide"><span id="nm"></span><span id="pt">⭐ 0</span></div><div id="v"><div class="big spin">⏳</div></div></div>
<script>
var me=null,S=null,cur='',sel={},nx=null,seq=0,joining=false;
try{me=JSON.parse(localStorage.getItem('kq')||'null')}catch(e){}
function jit(a,b){return a+Math.random()*(b-a)}
function R(k,h){if(cur===k)return false;cur=k;$('v').innerHTML=h;return true}
function sync(){clearTimeout(nx);var q=++seq;call('playerSync',[me&&me.id,me&&me.g],function(d){if(q!==seq)return;S=d;if(d.stale&&me){me=null}after()},function(){if(q===seq)nx=setTimeout(sync,jit(1500,3000))})}
function after(){tick();var w;
  if(S.stale||S.status!=='running')w=jit(2200,3500);
  else{var t=now(),ev=[];S.sched.forEach(function(x,i){ev.push(x[1]);if(i===S.sched.length-1)ev.push(x[2])});ev=ev.filter(function(e){return e>t});if(!ev.length)return;w=Math.min(8000,ev[0]-t+jit(300,1600))}
  nx=setTimeout(sync,w)}
sync();setInterval(tick,100);
function join(){if(joining)return;var n=$('in').value.trim();if(n.length<2){$('jm').textContent='Nama minimal 2 huruf ya';return}
  joining=true;var b=$('jb');b.disabled=true;b.textContent='Masuk…';
  var fail=function(m){joining=false;b.disabled=false;b.textContent='Gas Masuk! 🚀';$('jm').textContent=m};
  call('playerJoin',[n],function(r){if(!r.ok){fail(r.msg);return}joining=false;me={id:r.id,g:r.gid,name:r.name};try{localStorage.setItem('kq',JSON.stringify(me));localStorage.setItem('kqn',r.name)}catch(e){}
    seq++;clearTimeout(nx);S={stale:false,status:'lobby',name:r.name,n:1,title:S&&S.title};tick();sync()},function(){fail('Koneksi bermasalah, coba lagi')})}
function tick(){
  if(!S)return;var t=now();
  if(S.stale){$('bar').classList.add('hide');
    if(S.status==='lobby'){var pre='';try{pre=localStorage.getItem('kqn')||''}catch(e){}
      R('join','<div class="big bn">🎓</div><h1>'+esc(S.title)+'</h1><p>Isi nama panggilanmu dulu ya</p><input id="in" maxlength="18" placeholder="Nama kamu" autocomplete="off" onkeydown="if(event.key===\'Enter\')join()" value="'+esc(pre)+'"><button class="go" id="jb" onclick="join()">Gas Masuk! 🚀</button><div class="msg" id="jm"></div>')}
    else R('block','<div class="big">⏳</div><h2>Kuis sedang berlangsung</h2><p>Pendaftaran sudah ditutup. Tunggu sesi berikutnya ya!</p>');
    return}
  $('bar').classList.remove('hide');$('nm').textContent='👤 '+S.name;
  if(S.status!=='running'){if(R('wait','<div class="big bn">🎉</div><h2>Selamat, kamu berhasil login!</h2><p>Tunggu kuis dimulai sebentar lagi…</p><div class="dots"><span>●</span><span>●</span><span>●</span></div><p>👥 <b id="wn"></b> peserta sudah masuk</p>')){confetti(50,innerWidth/2,innerHeight*.35,14)}$('wn').textContent=S.n;return}
  var s=S.sched;
  if(t<s[0][0]){var n=Math.ceil((s[0][0]-t)/1000);R('count','<h2>Siap-siap!</h2><div class="big bn" id="cdn"></div><p>Soal pertama sebentar lagi</p>');$('cdn').textContent=n>3?'🔥':n;return}
  for(var i=0;i<s.length;i++){if(t<s[i][1]){question(i,t);return}if(t<s[i][2]){reveal(i);return}}
  final();
}
function mark(c){[0,1,2,3].forEach(function(k){var b=$('b'+k);if(b)b.classList.add(k===c?'sel':'dim')});$('msg').textContent='✓ Jawaban terkirim! Tunggu teman-temanmu…'}
function question(i,t){var q=S.qs[i],s=S.sched[i];
  if(R('q'+i,'<div class="qn">Soal '+(i+1)+' dari '+S.qs.length+'</div><div class="tm" id="tm"><i id="tf"></i><span id="tl"></span></div><div class="qt">'+esc(q.q)+'</div>'+q.o.map(function(x,k){return x?'<button class="pb o'+k+'" id="b'+k+'" style="animation-delay:'+k*.08+'s" onclick="pick('+i+','+k+')"><b>'+'ABCD'[k]+'</b><span>'+esc(x)+'</span></button>':''}).join('')+'<div class="msg" id="msg"></div>')){
    var c=S.my[i]!==undefined?S.my[i]:sel[i];if(c!==undefined)mark(c)}
  var left=Math.max(0,(s[1]-t)/1000);$('tf').style.width=left/s[3]*100+'%';$('tl').textContent=Math.ceil(left)+' detik';$('tm').classList.toggle('warn',left<=3)}
function pick(i,k){if(sel[i]!==undefined||(S.my&&S.my[i]!==undefined))return;sel[i]=k;mark(k);try{navigator.vibrate(40)}catch(e){}send(i,k,0)}
function send(i,k,n){call('playerAnswer',[me.id,me.g,i,k],function(r){if(!r.ok&&$('msg'))$('msg').textContent='⚠️ '+(r.msg||'Gagal mengirim')},function(){if(n<3)setTimeout(function(){send(i,k,n+1)},500*(n+1))})}
function reveal(i){var d=S.done&&S.done[i];
  if(!d){R('rw'+i,'<div class="big spin">⏳</div><h2>Menghitung hasil…</h2>');return}
  var ch=S.my[i]!==undefined?S.my[i]:sel[i],none=ch===undefined,ok=ch===d.c;
  if(R('r'+i,'<div class="big '+(ok?'bn':'sh')+'">'+(ok?'✅':none?'⏰':'❌')+'</div><h2>'+(ok?'Benar!':none?'Waktu habis':'Kurang tepat')+'</h2>'+(ok?'<div class="plus">+<span id="pp">0</span> poin</div>':'')+'<div class="ans">Jawaban benar:<br><b>'+'ABCD'[d.c]+'. '+esc(S.qs[i].o[d.c])+'</b></div><div class="stat"><span>Skor <b>'+S.total+'</b></span><span>Peringkat <b>#'+S.rank+'</b>/'+S.n+'</span></div><div class="msg">Soal berikutnya sebentar lagi…</div>')){
    if(ok){tween($('pp'),d.p,700);confetti(40,innerWidth/2,innerHeight*.35,14)}tween($('pt'),S.total,800,'⭐ ')}}
function closeOv(){var o=$('ov');if(o)o.classList.add('hide')}
function final(){
  if(!S.fin){R('fw','<div class="big spin">🏆</div><h2>Menghitung pemenang…</h2>');return}
  var r=S.rank,top=r>=1&&r<=3,k=top?r:0,n=S.qs.length,
  med=r===1?'🏆':r===2?'🥈':r===3?'🥉':r<=10?'🎖️':'🎓',
  ttl=top?'Kamu mendapat<br>JUARA '+r+'!':r<=10?'Kamu peringkat '+r+'<br>Masuk 10 Besar!':'Kamu peringkat '+r+'<br>dari '+S.n+' peserta',
  sub=r===1?'Tercepat dan terpintar hari ini 👑':r<=3?'Masuk podium kuis hari ini. Keren banget!':r<=10?'Sedikit lagi ke podium, hebat!':'Seru banget mainnya, terima kasih sudah ikut!',
  sl='SELAMAT!'.split('').map(function(c,i){return'<span style="animation-delay:'+i*.1+'s">'+c+'</span>'}).join(''),
  ov='<div class="ov t'+k+'" id="ov"><div class="rays"></div><div class="nc"><div class="medal">'+med+'</div><div class="sl">'+sl+'</div><h2>'+ttl+'</h2><p>'+sub+'</p><div class="stat"><span>Skor <b>'+S.total+'</b></span><span>Benar <b>'+S.corr+'/'+n+'</b></span></div><button class="go" onclick="closeOv()">Lihat Detail</button></div></div>';
  if(R('fin','<div class="big bn">'+med+'</div><h2>Peringkat #'+r+' dari '+S.n+'</h2><div class="stat" style="margin:12px 0"><span>Skor <b>'+S.total+'</b></span><span>Benar <b>'+S.corr+'/'+n+'</b></span></div><div class="ans">Pemenang kuis: <b>'+esc(S.fin.w.name)+'</b> 👑</div><p>Yuk lanjut kenalan lebih dekat dengan Kampus Asia!</p>')){
    var o=$('ov');if(o)o.remove();document.body.insertAdjacentHTML('beforeend',ov);
    tween($('pt'),S.total,600,'⭐ ');
    try{navigator.vibrate(top?[120,60,120,60,400]:[150])}catch(e){}
    tune(r===1?[523,659,784,1046,1318]:top?[523,659,784,1046]:[523,659,784]);
    if(r===1){confetti(200,innerWidth/2,innerHeight*.5,26);var c=0,iv=setInterval(function(){rain();firework(Math.random()*innerWidth,Math.random()*innerHeight*.5);if(++c>25)clearInterval(iv)},350)}
    else if(top)confetti(150,innerWidth/2,innerHeight*.5,22);
    else confetti(r<=10?90:40,innerWidth/2,innerHeight*.5,16)}}
</script></body></html>
